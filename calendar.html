<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar & Headlines - Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script src="gate.js"></script>

  <div id="site-header"></div>
  <script src="header.js"></script>
  <script src="loader.js"></script>

  <main>
    <h2>Calendar</h2>

    <div class="legend">
      <span class="chip school">School</span>
      <span class="chip fun">Fun</span>
    </div>

    <div class="calendar-controls">
      <button id="prev">&laquo; Prev</button>
      <strong id="month-label"></strong>
      <button id="next">Next &raquo;</button>
    </div>

    <table class="calendar">
      <thead>
        <tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
        </tr>
      </thead>
      <tbody id="calendar-body"></tbody>
    </table>

    <h3>This month</h3>
    <ul id="event-list"></ul>

    <h2>Headlines</h2>
    <div id="news-list"></div>
  </main>

  <footer>
    <p>&copy; 2026 Your Name</p>
  </footer>

  <script>
    const monthNames = ["January","February","March","April","May","June",
      "July","August","September","October","November","December"];

    let events = {};   // "YYYY-MM-DD" -> [{title, type}]
    const today = new Date();
    let year = today.getFullYear();
    let month = today.getMonth();

    function pad(n) { return String(n).padStart(2, "0"); }

    function addEvents(rows, type) {
      (rows || []).forEach(function (r) {
        const key = normalizeDate(r.Date || "");
        if (!key || !r.Title) return;
        if (!events[key]) events[key] = [];
        events[key].push({ title: r.Title, type: type });
      });
    }

    function render() {
      document.getElementById("month-label").textContent = monthNames[month] + " " + year;
      const body = document.getElementById("calendar-body");
      body.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let day = 1;
      for (let row = 0; row < 6 && day <= daysInMonth; row++) {
        const tr = document.createElement("tr");
        for (let col = 0; col < 7; col++) {
          const td = document.createElement("td");
          if ((row === 0 && col < firstDay) || day > daysInMonth) {
            td.className = "empty";
          } else {
            const key = year + "-" + pad(month + 1) + "-" + pad(day);
            const num = document.createElement("div");
            num.className = "day-num";
            num.textContent = day;
            td.appendChild(num);

            (events[key] || []).forEach(function (e) {
              const chip = document.createElement("div");
              chip.className = "chip " + e.type;
              chip.textContent = e.title;
              chip.title = e.title;
              td.appendChild(chip);
            });

            if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
              td.classList.add("today");
            }
            day++;
          }
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }

      const list = document.getElementById("event-list");
      list.innerHTML = "";
      const prefix = year + "-" + pad(month + 1);
      const keys = Object.keys(events).filter(function (k) { return k.startsWith(prefix); }).sort();
      if (keys.length === 0) {
        list.innerHTML = "<li>No events this month.</li>";
      } else {
        keys.forEach(function (k) {
          events[k].forEach(function (e) {
            const li = document.createElement("li");
            li.textContent = monthNames[month] + " " + parseInt(k.slice(8), 10) + ": " + e.title + " (" + e.type + ")";
            list.appendChild(li);
          });
        });
      }
    }

    function renderNews(rows) {
      const box = document.getElementById("news-list");
      box.innerHTML = "";
      if (rows === null) { box.textContent = "Could not load the headlines."; return; }
      if (rows.length === 0) { box.textContent = "No headlines yet."; return; }

      rows.sort(function (a, b) { return normalizeDate(b.Date).localeCompare(normalizeDate(a.Date)); });
      rows.forEach(function (r) {
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h3");
        h.textContent = r.Title || "";
        const d = document.createElement("p");
        const em = document.createElement("em");
        const iso = normalizeDate(r.Date || "");
        em.textContent = iso ? prettyDate(iso) : (r.Date || "");
        d.appendChild(em);
        const t = document.createElement("p");
        t.textContent = r.Text || "";
        card.appendChild(h); card.appendChild(d); card.appendChild(t);
        box.appendChild(card);
      });
    }

    document.getElementById("prev").onclick = function () {
      month--; if (month < 0) { month = 11; year--; }
      render();
    };
    document.getElementById("next").onclick = function () {
      month++; if (month > 11) { month = 0; year++; }
      render();
    };

    Promise.all([loadCSV("school"), loadCSV("fun"), loadCSV("news")]).then(function (res) {
      addEvents(res[0], "school");
      addEvents(res[1], "fun");
      render();
      renderNews(res[2]);
    });
  </script>

</body>
</html>
