<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar & Headlines - Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script src="gate.js"></script>

  <div id="site-header"></div>
  <script src="header.js"></script>
  <script src="loader.js"></script>

  <main>
    <h2>Calendar</h2>

        <h3>Coming up (next 2 weeks)</h3>
    <div class="upcoming">
      <div class="upcoming-col school">
        <h4>School</h4>
        <ul id="upcoming-school"></ul>
      </div>
      <div class="upcoming-col fun">
        <h4>Fun</h4>
        <ul id="upcoming-fun"></ul>
      </div>
    </div>

    <div class="legend">
      <span class="chip school">School</span>
      <span class="chip fun">Fun</span>
    </div>

    <div class="calendar-controls">
      <button id="prev">&laquo; Prev</button>
      <strong id="month-label"></strong>
      <button id="next">Next &raquo;</button>
    </div>

    <table class="calendar">
      <thead>
        <tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
        </tr>
      </thead>
      <tbody id="calendar-body"></tbody>
    </table>

    <h3>This month</h3>
    <ul id="event-list"></ul>

    <h2>Headlines</h2>
    <div id="news-list"></div>
  </main>

  <div id="site-footer"></div>
  <script src="footer.js"></script>

  <script>
    const monthNames = ["January","February","March","April","May","June",
      "July","August","September","October","November","December"];

    let events = {};   // "YYYY-MM-DD" -> [{title, type}]
    const today = new Date();
    let year = today.getFullYear();
    let month = today.getMonth();

    function pad(n) { return String(n).padStart(2, "0"); }

        function addEvents(rows, type) {
      (rows || []).forEach(function (r, i) {
        const start = normalizeDate(r.Date || "");
        if (!start || !r.Title) return;
        let end = normalizeDate(r["End Date"] || "");
        if (!end || end < start) end = start;

        const id = type + "-" + i;
        const p = start.split("-");
        const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));

        for (let n = 0; n < 366; n++) {   // safety limit of one year
          const key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
          if (key > end) break;
          if (!events[key]) events[key] = [];
          events[key].push({ id: id, title: r.Title, type: type, start: start, end: end });
          d.setDate(d.getDate() + 1);
        }
      });
    }

    function fmt(iso) {
      const p = iso.split("-");
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]))
        .toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function rangeText(e) {
      return e.start === e.end ? fmt(e.start) : fmt(e.start) + " – " + fmt(e.end);
    }

    const laneOf = {};   // event id -> slot number (0 = top)

    function assignLanes() {
      const seen = {}, list = [];
      Object.keys(events).forEach(function (k) {
        events[k].forEach(function (e) {
          if (!seen[e.id]) { seen[e.id] = true; list.push(e); }
        });
      });

      // Earlier and longer events get the top slots
      list.sort(function (a, b) {
        if (a.start !== b.start) return a.start < b.start ? -1 : 1;
        if (a.end !== b.end) return a.end > b.end ? -1 : 1;
        return a.id < b.id ? -1 : 1;
      });

      const used = {};   // day -> slots already taken
      list.forEach(function (e) {
        const days = Object.keys(events).filter(function (k) {
          return events[k].some(function (x) { return x.id === e.id; });
        });
        let lane = 0;
        while (days.some(function (k) { return used[k] && used[k][lane]; })) lane++;
        days.forEach(function (k) { (used[k] = used[k] || {})[lane] = true; });
        laneOf[e.id] = lane;
      });
    }

    function render() {
      document.getElementById("month-label").textContent = monthNames[month] + " " + year;
      const body = document.getElementById("calendar-body");
      body.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let day = 1;
      for (let row = 0; row < 6 && day <= daysInMonth; row++) {
        const tr = document.createElement("tr");
        for (let col = 0; col < 7; col++) {
          const td = document.createElement("td");
          if ((row === 0 && col < firstDay) || day > daysInMonth) {
            td.className = "empty";
          } else {
            const key = year + "-" + pad(month + 1) + "-" + pad(day);
            const num = document.createElement("div");
            num.className = "day-num";
            num.textContent = day;
            td.appendChild(num);

            const dayEvents = events[key] || [];
            let maxLane = -1;
            dayEvents.forEach(function (e) { maxLane = Math.max(maxLane, laneOf[e.id]); });

            for (let lane = 0; lane <= maxLane; lane++) {
              const e = dayEvents.find(function (x) { return laneOf[x.id] === lane; });
              const chip = document.createElement("div");

              if (!e) {   // empty slot: invisible placeholder keeps the height
                chip.className = "chip spacer";
                chip.innerHTML = "&nbsp;";
                td.appendChild(chip);
                continue;
              }

              chip.className = "chip " + e.type;
              const showTitle = (key === e.start || col === 0);
              chip.textContent = showTitle ? e.title : "\u00a0";
              chip.title = e.title;
              if (key !== e.start && col !== 0) chip.classList.add("join-left");
              if (key !== e.end && col !== 6) chip.classList.add("join-right");
              td.appendChild(chip);
            }

            if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
              td.classList.add("today");
            }
            day++;
          }
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }

      const list = document.getElementById("event-list");
      list.innerHTML = "";
      const prefix = year + "-" + pad(month + 1);
      const seen = {};
      Object.keys(events).filter(function (k) { return k.startsWith(prefix); }).sort().forEach(function (k) {
        events[k].forEach(function (e) {
          if (seen[e.id]) return;
          seen[e.id] = true;
          const li = document.createElement("li");
          li.textContent = rangeText(e) + ": " + e.title + " (" + e.type + ")";
          list.appendChild(li);
        });
      });
      if (!list.children.length) {
        list.innerHTML = "<li>No events this month.</li>";
      }
    }

    function renderNews(rows) {
      const box = document.getElementById("news-list");
      box.innerHTML = "";
      if (rows === null) { box.textContent = "Could not load the headlines."; return; }
      if (rows.length === 0) { box.textContent = "No headlines yet."; return; }

      rows.sort(function (a, b) { return normalizeDate(b.Date).localeCompare(normalizeDate(a.Date)); });
      rows.forEach(function (r) {
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h3");
        h.textContent = r.Title || "";
        const d = document.createElement("p");
        const em = document.createElement("em");
        const iso = normalizeDate(r.Date || "");
        em.textContent = iso ? prettyDate(iso) : (r.Date || "");
        d.appendChild(em);
        const t = document.createElement("p");
        t.textContent = r.Text || "";
        card.appendChild(h); card.appendChild(d); card.appendChild(t);
        box.appendChild(card);
      });
    }

        function renderUpcoming() {
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const end = new Date(start);
      end.setDate(end.getDate() + 14);   // change 14 to show more or fewer days

      ["school", "fun"].forEach(function (type) {
        const list = document.getElementById("upcoming-" + type);
        list.innerHTML = "";
        let count = 0; const seen = {};

        Object.keys(events).sort().forEach(function (k) {
          const p = k.split("-");
          const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          if (d < start || d > end) return;

          events[k].forEach(function (e) {
            if (e.type !== type || seen[e.id]) return;
            seen[e.id] = true;
            const li = document.createElement("li");
            li.textContent = rangeText(e) + ": " + e.title;            list.appendChild(li);
            count++;
          });
        });

        if (count === 0) {
          list.innerHTML = "<li>Nothing coming up.</li>";
        }
      });
    }

    document.getElementById("prev").onclick = function () {
      month--; if (month < 0) { month = 11; year--; }
      render();
    };
    document.getElementById("next").onclick = function () {
      month++; if (month > 11) { month = 0; year++; }
      render();
    };

    Promise.all([loadCSV("school"), loadCSV("fun"), loadCSV("news")]).then(function (res) {
      addEvents(res[0], "school");
      addEvents(res[1], "fun");
      assignLanes();
      render();
      renderUpcoming();
      renderNews(res[2]);
    });
  </script>

</body>
</html>
