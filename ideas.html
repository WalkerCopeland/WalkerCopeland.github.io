<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideas - Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script src="gate.js"></script>

  <div id="site-header"></div>
  <script src="header.js"></script>
  <script src="data.js"></script>

  <main>
    <h2>Ideas</h2>
    <div id="ideas-list"></div>
  </main>

  <div id="site-footer"></div>
  <script src="footer.js"></script>

  <script>
    loadCSV("ideas").then(function (rows) {
      const box = document.getElementById("ideas-list");
      if (rows === null) { box.textContent = "Could not load the ideas."; return; }
      if (rows.length === 0) { box.textContent = "No ideas yet."; return; }
      rows.forEach(function (r) {
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h3");
        h.textContent = r.Title || "";
        const p = document.createElement("p");
        p.textContent = r.Description || "";
        card.appendChild(h); card.appendChild(p);
        box.appendChild(card);
      });
    });
  </script>

</body>
</html>
