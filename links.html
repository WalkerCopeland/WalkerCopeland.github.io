<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links - Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header"></div>
  <script src="header.js"></script>
  <script src="data.js"></script>

  <main>
    <h2>Links</h2>
    <ul id="links-list"></ul>
  </main>

  <footer>
    <p>&copy; 2026 Your Name</p>
  </footer>

  <script>
    loadCSV("links").then(function (rows) {
      const list = document.getElementById("links-list");
      if (rows === null) { list.innerHTML = "<li>Could not load the links.</li>"; return; }
      if (rows.length === 0) { list.innerHTML = "<li>No links yet.</li>"; return; }
      rows.forEach(function (r) {
        if (!/^https?:\/\//i.test(r.URL || "")) return;   // only allow http(s) links
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = r.URL;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = r.Name || r.URL;
        li.appendChild(a);
        if (r.Description) li.appendChild(document.createTextNode(" - " + r.Description));
        list.appendChild(li);
      });
    });
  </script>

</body>
</html>
